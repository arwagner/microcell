<!doctype html>
<!--
  PROTOTYPE — throwaway. Answers: "What should the simplified 3D cell look like?"
  Three structurally different looks of the same procedurally built cell, switchable via ?variant=A|B|C
  and the bottom bar (or ← →). A second view (top-right button) shows one mitochondrion at the Organelle stop.
  Not to scale in every detail; shapes and counts are rough.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cell Look Prototype</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
  #c { display: block; width: 100vw; height: 100vh; }
  .lbl { font-size: 12px; padding: 2px 6px; border-radius: 4px; pointer-events: none; white-space: nowrap; }
  #tip { position: fixed; pointer-events: none; padding: 6px 10px; border-radius: 6px; font-size: 13px; max-width: 260px; display: none; z-index: 5; }
  #panel { position: fixed; left: 16px; bottom: 80px; max-width: 340px; padding: 12px 14px; border-radius: 10px; font-size: 14px; line-height: 1.4; display: none; z-index: 5; }
  #panel h3 { margin: 0 0 4px; font-size: 16px; }
  #legend { position: fixed; right: 16px; top: 64px; font-size: 13px; display: none; z-index: 5; }
  #legend div { padding: 3px 8px; cursor: default; border-radius: 4px; display: flex; gap: 8px; align-items: center; }
  #legend span.sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #view { position: fixed; right: 16px; top: 16px; z-index: 6; padding: 8px 12px; border-radius: 8px; border: 0; font-size: 13px; cursor: pointer; }
  #proto { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 10;
    background: #111; color: #fff; border-radius: 999px; padding: 6px 10px; display: flex; gap: 10px; align-items: center;
    box-shadow: 0 4px 16px rgba(0,0,0,.4); font: 13px ui-monospace, monospace; border: 2px dashed #ff0; }
  #proto button { background: #333; color: #fff; border: 0; border-radius: 999px; width: 28px; height: 28px; cursor: pointer; font-size: 14px; }
  #hint { position: fixed; left: 16px; top: 16px; font-size: 12px; opacity: .7; z-index: 5; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">drag = orbit · scroll = zoom · hover/click things</div>
<div id="tip"></div>
<div id="panel"></div>
<div id="legend"></div>
<button id="view">Show: one mitochondrion (Organelle stop)</button>
<div id="proto"><button id="prev">←</button><span id="vlabel"></span><button id="next">→</button></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------- variants ----------
const VARIANTS = {
  A: { name: 'Textbook: solid colour per organelle, labels always on' },
  B: { name: 'Goodsell: flat painted shading, outlines, hover labels' },
  C: { name: 'Fluorescence: glowing on black, like a microscope image, legend' },
};
const keys = Object.keys(VARIANTS);
const params = new URLSearchParams(location.search);
const V = keys.includes(params.get('variant')) ? params.get('variant') : 'A';
const mode = params.get('view') === 'mito' ? 'mito' : 'cell';
document.getElementById('vlabel').textContent = `${V} (${VARIANTS[V].name})`;
function go(v, view = mode) { const p = new URLSearchParams(); p.set('variant', v); if (view === 'mito') p.set('view', 'mito'); location.search = p.toString(); }
const idx = keys.indexOf(V);
document.getElementById('prev').onclick = () => go(keys[(idx + keys.length - 1) % keys.length]);
document.getElementById('next').onclick = () => go(keys[(idx + 1) % keys.length]);
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') document.getElementById('prev').click();
  if (e.key === 'ArrowRight') document.getElementById('next').click();
});
const viewBtn = document.getElementById('view');
viewBtn.textContent = mode === 'cell' ? 'Show: one mitochondrion (Organelle stop)' : 'Show: whole cell (Cell stop)';
viewBtn.onclick = () => go(V, mode === 'cell' ? 'mito' : 'cell');

// ---------- content (label + paragraph = first two explanation layers) ----------
const INFO = {
  membrane: ['Plasma membrane', 'A thin oily skin, about 5–10 nm thick, wrapping the whole cell and controlling what gets in and out.'],
  nucleus: ['Nucleus', 'Holds the cell\'s DNA, about 2 metres of it, packed into a ball roughly 6 µm across.'],
  nucleolus: ['Nucleolus', 'A dense region inside the nucleus where ribosomes start being built.'],
  rer: ['Rough ER', 'Folded sheets of membrane studded with ribosomes. Proteins made here are threaded inside to be finished.'],
  ser: ['Smooth ER', 'A network of tubes with no ribosomes. It makes fats and stores calcium.'],
  golgi: ['Golgi apparatus', 'A stack of flattened sacs that finishes, sorts and ships proteins to where they are needed.'],
  mito: ['Mitochondrion', 'The cell\'s power plant: it makes most of the cell\'s ATP fuel. A cell has hundreds.'],
  lyso: ['Lysosome', 'A bag of digestive enzymes that breaks down worn-out parts and things the cell swallowed.'],
  perox: ['Peroxisome', 'A small sac that breaks down fatty acids and neutralises hydrogen peroxide.'],
  vesicle: ['Vesicle', 'A tiny membrane bubble, around 50 nm, carrying cargo between compartments.'],
  mt: ['Microtubule', 'A hollow protein tube 25 nm wide: the cell\'s scaffolding and its railway for motor proteins.'],
  centrosome: ['Centrosome', 'The hub microtubules grow out from.'],
  outer: ['Outer membrane', 'The smooth outer skin of the mitochondrion.'],
  cristae: ['Cristae', 'Folds of the inner membrane. ATP synthase machines line their edges, spinning to make ATP.'],
  matrix: ['Matrix', 'The gel-filled interior, holding the mitochondrion\'s own small DNA and enzymes.'],
};

const PAL = {
  A: { bg: '#f4f1ea', ink: '#222', membrane: '#8cc8f0', nucleus: '#7b6cd9', nucleolus: '#3e2f9c', rer: '#3fa99c', ser: '#86cf8f', golgi: '#f0a830', mito: '#e8604c', lyso: '#b85ccf', perox: '#4f9fe0', vesicle: '#e9c94a', mt: '#9a9a9a', centrosome: '#555', outer: '#e8604c', cristae: '#f39a7e', matrix: '#f7d2c4' },
  B: { bg: '#ead9b5', ink: '#3a2a1a', membrane: '#8fbf6a', nucleus: '#a78bd0', nucleolus: '#6a4fa0', rer: '#d98b5f', ser: '#e4ad78', golgi: '#e3c35a', mito: '#d9694f', lyso: '#c47aa8', perox: '#9bbf7a', vesicle: '#f0d38a', mt: '#a8936e', centrosome: '#7a6040', outer: '#d9694f', cristae: '#e8957a', matrix: '#f2c9a8' },
  C: { bg: '#02030a', ink: '#ddd', membrane: '#00ff88', nucleus: '#2a5bff', nucleolus: '#7f9bff', rer: '#00d0ff', ser: '#0090b0', golgi: '#ffcc00', mito: '#ff2244', lyso: '#ff44ff', perox: '#88ff00', vesicle: '#ffaa55', mt: '#33ff66', centrosome: '#ffffff', outer: '#ff2244', cristae: '#ff6677', matrix: '#661122' },
}[V];

// ---------- renderer / scene ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL.bg);
document.body.style.background = PAL.bg;
document.body.style.color = PAL.ink;
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 500);
camera.position.set(0, 6, mode === 'cell' ? 26 : 6);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', top: 0, left: 0, pointerEvents: 'none' });
document.body.appendChild(labelRenderer.domElement);

if (V === 'A') {
  scene.add(new THREE.HemisphereLight(0xffffff, 0xb0a890, 1.6));
  const d = new THREE.DirectionalLight(0xffffff, 1.6); d.position.set(10, 20, 15); scene.add(d);
} else if (V === 'B') {
  scene.add(new THREE.AmbientLight(0xffffff, 1.2));
  const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(8, 15, 20); scene.add(d);
}

const gradient = (() => { const t = new THREE.DataTexture(new Uint8Array([90, 170, 255]), 3, 1, THREE.RedFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();

function mat(kind, { opacity = 1 } = {}) {
  const color = new THREE.Color(PAL[kind]);
  if (V === 'A') return new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0, transparent: opacity < 1, opacity, depthWrite: opacity >= 1, side: opacity < 1 ? THREE.DoubleSide : THREE.FrontSide });
  if (V === 'B') return new THREE.MeshToonMaterial({ color, gradientMap: gradient, transparent: opacity < 1, opacity, depthWrite: opacity >= 1, side: opacity < 1 ? THREE.DoubleSide : THREE.FrontSide });
  return new THREE.MeshBasicMaterial({ color, transparent: true, opacity: Math.min(0.35, opacity * 0.35), blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
}
const pickables = [];
const byKind = {};
function add(mesh, kind, parent, { outline = true } = {}) {
  mesh.userData.kind = kind;
  parent.add(mesh); pickables.push(mesh);
  (byKind[kind] ||= []).push(mesh);
  if (V === 'B' && outline && !mesh.isInstancedMesh) {
    const hull = new THREE.Mesh(mesh.geometry, new THREE.MeshBasicMaterial({ color: '#2a1a0a', side: THREE.BackSide }));
    hull.scale.setScalar(1.06); hull.raycast = () => {};
    mesh.add(hull);
  }
  return mesh;
}
// seeded random so every variant shows the same cell
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rv = (min, max) => min + (max - min) * rnd();
function randDir() { const v = new THREE.Vector3(rv(-1, 1), rv(-1, 1), rv(-1, 1)); return v.lengthSq() > 1 || v.lengthSq() < 0.01 ? randDir() : v.normalize(); }
function wobble(geo, amp, freq) {
  const p = geo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); const n = 1 + amp * Math.sin(v.x * freq) * Math.sin(v.y * freq * 1.3) * Math.sin(v.z * freq * 0.7 + 1); v.multiplyScalar(n); p.setXYZ(i, v.x, v.y, v.z); }
  geo.computeVertexNormals(); return geo;
}

const root = new THREE.Group(); scene.add(root);
const anchors = {}; // one representative position per kind for always-on labels

function buildCell() {
  const R = 9, NR = 3.2; // µm-ish units: cell ~18 µm across, nucleus ~6.4 µm
  const nucleusPos = new THREE.Vector3(-1, 0, 0);
  add(new THREE.Mesh(wobble(new THREE.SphereGeometry(R, 96, 64), 0.05, 0.35), mat('membrane', { opacity: V === 'C' ? 0.12 : 0.18 })), 'membrane', root, { outline: false });
  anchors.membrane = new THREE.Vector3(0, R, 0);
  const nuc = add(new THREE.Mesh(wobble(new THREE.SphereGeometry(NR, 64, 48), 0.04, 0.9), mat('nucleus', { opacity: V === 'C' ? 0.5 : 0.75 })), 'nucleus', root, { outline: false });
  nuc.position.copy(nucleusPos); anchors.nucleus = nucleusPos.clone().add(new THREE.Vector3(0, NR, 0));
  const nl = add(new THREE.Mesh(new THREE.SphereGeometry(1.0, 32, 24), mat('nucleolus')), 'nucleolus', root);
  nl.position.copy(nucleusPos).add(new THREE.Vector3(0.6, 0.4, 0.5)); anchors.nucleolus = nl.position.clone();
  // rough ER: partial shells (cisternae) wrapped around the nucleus
  for (let i = 0; i < 22; i++) {
    const r = NR + 0.5 + (i % 4) * 0.4;
    const g = wobble(new THREE.SphereGeometry(r, 24, 16, rv(0, 6.28), rv(0.5, 1.0), rv(0.6, 2.2), rv(0.25, 0.5)), 0.08, 2.2);
    const m = add(new THREE.Mesh(g, mat('rer', { opacity: 0.85 })), 'rer', root, { outline: false });
    m.material.side = THREE.DoubleSide; m.position.copy(nucleusPos);
    if (i === 5) anchors.rer = nucleusPos.clone().add(new THREE.Vector3(0, 0, r));
  }
  // smooth ER: tangle of tubes off to one side
  const serC = new THREE.Vector3(3.5, -3, 2);
  for (let i = 0; i < 14; i++) {
    const pts = []; let p = serC.clone().add(randDir().multiplyScalar(rv(0, 1.5)));
    for (let k = 0; k < 5; k++) { pts.push(p.clone()); p.add(randDir().multiplyScalar(0.8)); }
    add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, 0.09, 6), mat('ser')), 'ser', root, { outline: false });
  }
  anchors.ser = serC;
  // Golgi: stack of curved discs
  const golgiC = new THREE.Vector3(3.6, 2.2, -0.8);
  const gq = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), golgiC.clone().sub(nucleusPos).normalize());
  for (let i = 0; i < 6; i++) {
    const s = 1.6 - Math.abs(i - 2.5) * 0.15;
    const g = new THREE.SphereGeometry(3, 32, 8, 0, Math.PI * 2, 0, 0.5);
    g.scale(s / 1.4, 0.35, s / 1.4 * 0.6);
    const m = add(new THREE.Mesh(g, mat('golgi')), 'golgi', root);
    m.material.side = THREE.DoubleSide;
    m.quaternion.copy(gq); m.position.copy(golgiC).add(new THREE.Vector3(0, 1, 0).applyQuaternion(gq).multiplyScalar(i * 0.28 - 0.7));
  }
  anchors.golgi = golgiC;
  // mitochondria: capsules in the cytoplasm
  const placeInCyto = (minR, maxR) => { for (;;) { const p = randDir().multiplyScalar(rv(minR, maxR)); if (p.distanceTo(nucleusPos) > NR + 1.2) return p; } };
  const mitoGeo = new THREE.CapsuleGeometry(0.32, 1.3, 8, 16);
  for (let i = 0; i < 45; i++) {
    const m = add(new THREE.Mesh(mitoGeo, mat('mito')), 'mito', root);
    m.position.copy(placeInCyto(4.5, R - 0.8)); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), randDir());
    if (i === 0) anchors.mito = m.position.clone();
  }
  const ball = (kind, n, r, minR) => { const g = new THREE.SphereGeometry(r, 20, 14); for (let i = 0; i < n; i++) { const m = add(new THREE.Mesh(g, mat(kind)), kind, root); m.position.copy(placeInCyto(minR, R - 0.6)); if (i === 0) anchors[kind] = m.position.clone(); } };
  ball('lyso', 14, 0.3, 4.5); ball('perox', 14, 0.17, 4.5);
  // vesicles: instanced
  const vn = 220, vm = new THREE.InstancedMesh(new THREE.SphereGeometry(0.07, 10, 8), mat('vesicle'), vn), d = new THREE.Object3D();
  for (let i = 0; i < vn; i++) { d.position.copy(i < 80 ? golgiC.clone().add(randDir().multiplyScalar(rv(0.8, 2.2))) : placeInCyto(4.2, R - 0.3)); d.updateMatrix(); vm.setMatrixAt(i, d.matrix); }
  add(vm, 'vesicle', root); anchors.vesicle = golgiC.clone().add(new THREE.Vector3(1.8, 1, 0));
  // centrosome + microtubules
  const cen = nucleusPos.clone().add(new THREE.Vector3(2.2, 2.6, 1.2));
  for (const q of [new THREE.Euler(0, 0, 0), new THREE.Euler(Math.PI / 2, 0, 0)]) {
    const m = add(new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.45, 12), mat('centrosome')), 'centrosome', root);
    m.position.copy(cen); m.rotation.copy(q);
  }
  anchors.centrosome = cen;
  for (let i = 0; i < 46; i++) {
    let end = randDir().multiplyScalar(R - 0.4);
    if (end.distanceTo(nucleusPos) < NR + 2) end = end.negate();
    const mid = cen.clone().lerp(end, 0.5).add(randDir().multiplyScalar(1.2));
    if (mid.distanceTo(nucleusPos) < NR + 0.6) mid.add(mid.clone().sub(nucleusPos).normalize().multiplyScalar(2));
    add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([cen, mid, end]), 40, 0.035, 5), mat('mt', { opacity: V === 'A' ? 0.7 : 1 })), 'mt', root, { outline: false });
    if (i === 0) anchors.mt = mid;
  }
}

function buildMito() {
  // one mitochondrion ~2 µm long, opened up: outer membrane see-through, cristae inside
  const L = 3, r = 0.8;
  const outer = add(new THREE.Mesh(new THREE.CapsuleGeometry(r, L, 16, 48), mat('outer', { opacity: 0.25 })), 'outer', root, { outline: false });
  outer.rotation.z = Math.PI / 2; anchors.outer = new THREE.Vector3(0, r, 0);
  const matrix = add(new THREE.Mesh(new THREE.CapsuleGeometry(r * 0.9, L, 16, 48), mat('matrix', { opacity: V === 'C' ? 0.15 : 0.3 })), 'matrix', root, { outline: false });
  matrix.rotation.z = Math.PI / 2; anchors.matrix = new THREE.Vector3(-L / 2 - 0.2, 0, 0);
  for (let i = 0; i < 11; i++) {
    const x = -L / 2 + 0.15 + i * (L - 0.3) / 10;
    const g = wobble(new THREE.CylinderGeometry(r * 0.8, r * 0.8, 0.06, 40, 1), 0.08, 5);
    g.scale(1, 1, rv(0.55, 0.9));
    const m = add(new THREE.Mesh(g, mat('cristae')), 'cristae', root);
    m.rotation.z = Math.PI / 2 + rv(-0.2, 0.2); m.position.set(x, 0, rv(-0.1, 0.1));
    if (i === 5) anchors.cristae = new THREE.Vector3(x, r * 0.6, 0);
  }
}
mode === 'cell' ? buildCell() : buildMito();

// ---------- labels: A = always-on tags, B = hover tooltip, C = legend ----------
const tip = document.getElementById('tip'), panel = document.getElementById('panel'), legend = document.getElementById('legend');
const surface = V === 'C' ? 'rgba(10,14,30,.85)' : V === 'B' ? 'rgba(250,240,215,.95)' : 'rgba(255,255,255,.92)';
for (const el of [tip, panel]) { el.style.background = surface; el.style.color = PAL.ink; el.style.border = V === 'B' ? '2px solid #3a2a1a' : '1px solid rgba(128,128,128,.4)'; }
viewBtn.style.background = surface; viewBtn.style.color = PAL.ink;

if (V === 'A') {
  for (const [kind, pos] of Object.entries(anchors)) {
    const el = document.createElement('div'); el.className = 'lbl'; el.textContent = INFO[kind][0];
    el.style.background = 'rgba(255,255,255,.85)'; el.style.color = '#222'; el.style.borderLeft = `4px solid ${PAL[kind]}`;
    const o = new CSS2DObject(el); o.position.copy(pos); root.add(o);
  }
}
let legendRows = {};
if (V === 'C') {
  legend.style.display = 'block';
  for (const kind of Object.keys(byKind)) {
    const row = document.createElement('div');
    row.innerHTML = `<span class="sw" style="background:${PAL[kind]};box-shadow:0 0 6px ${PAL[kind]}"></span>${INFO[kind][0]}`;
    row.onmouseenter = () => focusKind(kind); row.onmouseleave = () => focusKind(null);
    row.onclick = () => showPanel(kind);
    legend.appendChild(row); legendRows[kind] = row;
  }
}
const baseOpacity = new Map(pickables.map(m => [m, m.material.opacity]));
function focusKind(kind) {
  for (const m of pickables) {
    const on = !kind || m.userData.kind === kind;
    m.material.transparent = true; m.material.opacity = on ? baseOpacity.get(m) : baseOpacity.get(m) * 0.08;
  }
  for (const [k, row] of Object.entries(legendRows)) row.style.background = k === kind ? 'rgba(255,255,255,.15)' : '';
}
function showPanel(kind) {
  if (!kind) { panel.style.display = 'none'; return; }
  const [t, p] = INFO[kind];
  panel.innerHTML = `<h3 style="border-left:5px solid ${PAL[kind]};padding-left:8px">${t}</h3>${p}<div style="opacity:.6;margin-top:6px;font-size:12px">Go deeper → (not in prototype)</div>`;
  panel.style.display = 'block';
}

// ---------- picking ----------
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let hovered = null, downAt = null;
function pick(e) {
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(pickables, false).filter(h => !['membrane', 'outer', 'matrix'].includes(h.object.userData.kind) || true);
  // prefer anything over the enclosing membranes
  const inner = hits.find(h => !['membrane', 'outer', 'matrix'].includes(h.object.userData.kind));
  return (inner || hits[0])?.object.userData.kind ?? null;
}
canvas.addEventListener('pointermove', e => {
  const k = pick(e);
  if (k !== hovered) { hovered = k; if (V === 'C') focusKind(k); canvas.style.cursor = k ? 'pointer' : ''; }
  if (V === 'B' && k) { tip.style.display = 'block'; tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 14 + 'px'; tip.innerHTML = `<b>${INFO[k][0]}</b><br>${INFO[k][1]}`; }
  else tip.style.display = 'none';
});
canvas.addEventListener('pointerdown', e => downAt = [e.clientX, e.clientY]);
canvas.addEventListener('pointerup', e => { if (downAt && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) < 5) showPanel(pick(e)); });

// ---------- render loop ----------
let composer = null;
if (V === 'C') {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.4, 0.15));
  composer.addPass(new OutputPass());
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight); composer?.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(t => {
  root.rotation.y = t * 0.00004;
  controls.update();
  composer ? composer.render() : renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});
</script>
</body>
</html>
